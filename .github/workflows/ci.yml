name: CI

# Checks on every push and pull request. On push to main, also builds the hook-free directory
# edition of the plugin from adapters/claude and fast-forwards it to the `release` branch,
# which the Anthropic plugin directory submission tracks. main keeps hooks and scripts.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # Checker scripts (validator, secret scan, router check) live in the public aiaddon repo; pinned to a full commit SHA.
  TOOLS_REF: 4364a0e0d80f08ae4b503c1a84818725e285122c

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for the secret scan
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: syncwin/aiaddon
          ref: ${{ env.TOOLS_REF }}
          path: .checker-tools
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Generated files are current
        run: python scripts/build_adapters.py --check
      - name: Unit tests
        run: |
          for t in tests/test_*.py; do python "$t"; done
      - name: Check the router against its evals
        run: python .checker-tools/dev/aiaddon-review/scripts/route_check.py adapters/claude
      - name: Scan the tree and the full git history for secrets and private data (blocking)
        run: python .checker-tools/dev/aiaddon-review/scripts/scan_secrets.py . --history

  release:
    # Directory edition: adapters/claude without hooks, scripts, .mcp.json, contract.yaml, evals and prompt data.
    name: Update the release branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: syncwin/aiaddon
          ref: ${{ env.TOOLS_REF }}
          path: .checker-tools
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the shipped tree without hooks
        env:
          SHIP: ${{ runner.temp }}/ship
        run: |
          python scripts/build_adapters.py
          python - <<'PY'
          import json, os, shutil
          src, out = "adapters/claude", os.environ["SHIP"]
          drop = {"hooks", "scripts", "evals", "prompts", ".mcp.json", "contract.yaml"}  # top level only
          def ignore(d, names):
              top = os.path.normpath(d) == os.path.normpath(src)
              return [n for n in names if (top and n in drop) or n == "__pycache__" or n.endswith(".pyc")]
          shutil.copytree(src, out, ignore=ignore)
          pj = os.path.join(out, ".claude-plugin", "plugin.json")
          with open(pj, encoding="utf-8") as f:
              m = json.load(f)
          for k in ("hooks", "mcpServers"):
              m.pop(k, None)
          with open(pj, "w", encoding="utf-8", newline="\n") as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
              f.write("\n")
          for gone in ("hooks", "scripts", ".mcp.json"):
              assert not os.path.exists(os.path.join(out, gone)), gone + " must not ship"
          print("built", out, "version", m["version"])
          PY
      - name: Validate the shipped tree for the directory (blocking)
        env:
          SHIP: ${{ runner.temp }}/ship
        run: |
          python .checker-tools/dev/aiaddon-review/scripts/validate_extension.py "$SHIP" --strict --target directory --require-meta author,company
          python .checker-tools/dev/aiaddon-review/scripts/scan_secrets.py "$SHIP"
      - name: Push the release branch
        env:
          SHIP: ${{ runner.temp }}/ship
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # The shipped tree becomes the root of the release branch. Fast-forward only (no force-push):
          # a new commit on top of the current release branch.
          export GIT_INDEX_FILE="$RUNNER_TEMP/release.index"
          git --work-tree="$SHIP" add -A -f
          tree=$(git write-tree)
          parent=$(git rev-parse -q --verify origin/release || true)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then echo "release branch already up to date"; exit 0; fi
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "release: directory edition from ${GITHUB_SHA::7}")
          git push origin "$commit:refs/heads/release"
